<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - AquaSprint</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="/images/logo-white.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- CSS Link -->
    <link rel="stylesheet" href="404.css" />
  </head>
  <body>
    <!-- Controls: RTL & Dark Mode -->
    <div class="controls">
      <button class="control-btn" id="rtlToggle" aria-label="Toggle RTL">
        <i data-lucide="arrow-left-right"></i>
      </button>
      <button
        class="control-btn"
        id="darkModeToggle"
        aria-label="Toggle Dark Mode"
      >
        <i data-lucide="moon"></i>
      </button>
    </div>

    <!-- 404 Content -->
    <main class="error-404">
      <div class="error-icon">
        <i data-lucide="map-pin-off"></i>
      </div>
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>
        Oops! The page you're looking for doesn't exist or has been moved. Let's
        get you back on track.
      </p>
      <a href="/homepages/home1.html" class="home-btn">
        <i data-lucide="home"></i>
        Back to Home
      </a>
    </main>

    <!-- Scripts -->
    <script>
      lucide.createIcons();

      const darkModeToggle = document.getElementById("darkModeToggle");
      const rtlToggle = document.getElementById("rtlToggle");

      function setButtonIcon(button, iconName) {
        const oldIcon = button.querySelector("svg, [data-lucide]");
        if (!oldIcon) return;

        const newIcon = document.createElement("i");
        newIcon.setAttribute("data-lucide", iconName);
        oldIcon.replaceWith(newIcon);

        lucide.createIcons({ root: button });
      }

      // Apply saved state
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark-mode");
      }

      document.documentElement.dir =
        localStorage.getItem("dir") === "rtl" ? "rtl" : "ltr";

      // Set initial icon
      if (darkModeToggle) {
        const isDark = document.body.classList.contains("dark-mode");
        setButtonIcon(darkModeToggle, isDark ? "sun" : "moon");

        darkModeToggle.addEventListener("click", () => {
          const isDarkNow = document.body.classList.toggle("dark-mode");
          localStorage.setItem("theme", isDarkNow ? "dark" : "light");

          setButtonIcon(darkModeToggle, isDarkNow ? "sun" : "moon");
        });
      }

      // RTL toggle
      if (rtlToggle) {
        rtlToggle.addEventListener("click", () => {
          const newDir = document.documentElement.dir === "rtl" ? "ltr" : "rtl";
          document.documentElement.dir = newDir;
          localStorage.setItem("dir", newDir);
        });
      }
    </script>
  </body>
</html>
