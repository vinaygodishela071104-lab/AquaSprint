<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upcoming - AquaSprint</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- CSS Link -->
    <link rel="stylesheet" href="upcoming.css" />
  </head>
  <body>
    <!-- Controls: RTL & Dark Mode -->
    <div class="controls">
      <button class="control-btn" id="rtlToggle" aria-label="Toggle RTL">
        <i data-lucide="arrow-left-right"></i>
      </button>
      <button
        class="control-btn"
        id="darkModeToggle"
        aria-label="Toggle Dark Mode"
      >
        <i data-lucide="moon"></i>
      </button>
    </div>

    <!-- Upcoming Content -->
    <main class="upcoming-page">
      <!-- Logo Section -->
      <div class="logo">
        <a href="/homepages/home1.html">
          <img
            src="/images/logo-white.png"
            alt="AquaSprint Logo"
            id="themeLogo"
          />
        </a>
        <div class="logo-text">
          <h1>AQUA<span>SPRINT</span></h1>
          <p>BORN FOR EVERY STROKE.</p>
        </div>
      </div>

      <h1>Coming Soon</h1>
      <h2>Something Amazing is in the Works</h2>
      <p>
        We're working on something special! Stay tuned for exciting updates and
        fresh content.
      </p>

      <!-- Countdown Timer -->
      <div class="countdown-container">
        <div class="countdown-item">
          <span class="countdown-number" id="days">00</span>
          <span class="countdown-label">Days</span>
        </div>
        <div class="countdown-separator">:</div>
        <div class="countdown-item">
          <span class="countdown-number" id="hours">00</span>
          <span class="countdown-label">Hours</span>
        </div>
        <div class="countdown-separator">:</div>
        <div class="countdown-item">
          <span class="countdown-number" id="minutes">00</span>
          <span class="countdown-label">Mins</span>
        </div>
        <div class="countdown-separator">:</div>
        <div class="countdown-item">
          <span class="countdown-number" id="seconds">00</span>
          <span class="countdown-label">Secs</span>
        </div>
      </div>

      <!-- Notify Me Section -->
      <form class="notify-form" id="notifyForm">
        <div class="form-group">
          <input
            type="email"
            id="emailInput"
            placeholder="Enter your email"
            required
            autocomplete="email"
          />
          <button type="submit" class="notify-btn">
            <i data-lucide="send"></i>
            Notify Me
          </button>
        </div>
        <p class="form-message" id="formMessage"></p>
      </form>

      <a href="/homepages/home1.html" class="home-btn">
        <i data-lucide="arrow-left"></i>
        Back to Home
      </a>
    </main>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        lucide.createIcons();

        const darkModeToggle = document.getElementById("darkModeToggle");
        const rtlToggle = document.getElementById("rtlToggle");

        const notifyForm = document.getElementById("notifyForm");
        const emailInput = document.getElementById("emailInput");
        const formMessage = document.getElementById("formMessage");

        // Apply saved dark mode
        if (localStorage.getItem("theme") === "dark") {
          document.body.classList.add("dark-mode");
        } else {
          document.body.classList.remove("dark-mode");
        }

        // Apply saved RTL
        document.documentElement.dir =
          localStorage.getItem("dir") === "rtl" ? "rtl" : "ltr";

        // Dark mode toggle
        if (darkModeToggle) {
          darkModeToggle.addEventListener("click", () => {
            const isDark = document.body.classList.toggle("dark-mode");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            lucide.createIcons();
          });
        }

        // RTL toggle
        if (rtlToggle) {
          rtlToggle.addEventListener("click", () => {
            const newDir =
              document.documentElement.dir === "rtl" ? "ltr" : "rtl";
            document.documentElement.dir = newDir;
            localStorage.setItem("dir", newDir);
          });
        }

        // Countdown
        const launchDate = new Date();
        launchDate.setDate(launchDate.getDate() + 30);

        function updateCountdown() {
          const now = new Date().getTime();
          const distance = launchDate - now;

          const daysEl = document.getElementById("days");
          const hoursEl = document.getElementById("hours");
          const minutesEl = document.getElementById("minutes");
          const secondsEl = document.getElementById("seconds");

          if (!daysEl || !hoursEl || !minutesEl || !secondsEl) return;

          if (distance < 0) {
            daysEl.textContent = "00";
            hoursEl.textContent = "00";
            minutesEl.textContent = "00";
            secondsEl.textContent = "00";
            return;
          }

          const days = Math.floor(distance / (1000 * 60 * 60 * 24));
          const hours = Math.floor(
            (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
          );
          const minutes = Math.floor(
            (distance % (1000 * 60 * 60)) / (1000 * 60),
          );
          const seconds = Math.floor((distance % (1000 * 60)) / 1000);

          daysEl.textContent = String(days).padStart(2, "0");
          hoursEl.textContent = String(hours).padStart(2, "0");
          minutesEl.textContent = String(minutes).padStart(2, "0");
          secondsEl.textContent = String(seconds).padStart(2, "0");
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Notify form
        if (notifyForm && emailInput && formMessage) {
          const savedEmail = localStorage.getItem("notifyEmail");

          if (savedEmail) {
            emailInput.value = savedEmail;
            formMessage.textContent = "You're already subscribed!";
            formMessage.className = "form-message success";
          }

          notifyForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();

            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
              formMessage.textContent = "Please enter a valid email";
              formMessage.className = "form-message error";
              return;
            }

            localStorage.setItem("notifyEmail", email);
            formMessage.textContent = "Success! You'll be notified!";
            formMessage.className = "form-message success";

            setTimeout(() => {
              emailInput.value = "";
            }, 2000);
          });
        }
      });
    </script>
  </body>
</html>
